[package]
name = "mitoolbox-native"
edition = "2024"
version = "0.1.0"
license = "MIT"
description = "MiToolbox-Native — whyred flash/unlock toolbox (Tauri v2)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mibox-core = { path = "crates/mibox-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
