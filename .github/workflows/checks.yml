name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools
      - name: fmt
        working-directory: tools
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: tools
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        working-directory: tools
        run: cargo test --workspace --locked
      - name: shell syntax
        run: |
          for f in flash_all.sh scripts/*.sh edk2/*.sh pve/*.sh tests/*.sh; do bash -n "$f"; done
          sh -n scripts/lavender-boot-fastboot.sh
      - name: python unit tests
        run: python3 -B tools/test_tools.py
      - name: flash_all safety gates
        run: ./tests/flash_all_test.sh
      - name: manifest
        run: cd dist && sha256sum -c SHA256SUMS

  tools-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: test tools on macOS
        working-directory: tools
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
      - name: python unit tests
        run: python3 -B tools/test_tools.py
